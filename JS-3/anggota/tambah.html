<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMPUS-Mini | Tambah Anggota</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">

        <div class="
            relative
            w-full
            max-w-6xl
            min-[1400px]:max-w-7xl
            mx-auto
            px-5
            py-4
            flex
            items-center
            justify-between
        ">

            <h1 class="text-xl font-bold text-indigo-600">
                SIMPUS-Mini
            </h1>

            <!-- Hamburger -->
            <input
                type="checkbox"
                id="nav-toggle"
                class="peer sr-only">

            <label
                for="nav-toggle"
                class="
                    md:hidden
                    text-2xl
                    text-slate-700
                    cursor-pointer
                    select-none
                ">
                ☰
            </label>

            <!-- Navbar -->
            <nav class="
                hidden
                peer-checked:block

                absolute
                top-full
                left-0
                w-full

                bg-white
                border-b
                border-slate-200
                shadow-md
                p-4

                md:block
                md:static
                md:w-auto
                md:border-0
                md:shadow-none
                md:p-0
            ">

                <ul class="flex flex-col gap-2 md:flex-row md:items-center">

                    <li>
                        <a
                            href="../index.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                text-slate-600
                                hover:bg-indigo-50
                                hover:text-indigo-600
                                transition
                            ">
                            Beranda
                        </a>
                    </li>

                    <li>
                        <a
                            href="../buku/list.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                text-slate-600
                                hover:bg-indigo-50
                                hover:text-indigo-600
                                transition
                            ">
                            Daftar Buku
                        </a>
                    </li>

                    <li>
                        <a
                            href="../buku/tambah.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                text-slate-600
                                hover:bg-indigo-50
                                hover:text-indigo-600
                                transition
                            ">
                            Tambah Buku
                        </a>
                    </li>

                    <li>
                        <a
                            href="list.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                text-slate-600
                                hover:bg-indigo-50
                                hover:text-indigo-600
                                transition
                            ">
                            Daftar Anggota
                        </a>
                    </li>

                    <li>
                        <a
                            href="tambah.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                bg-indigo-50
                                text-indigo-600
                                font-medium
                            ">
                            Tambah Anggota
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- MAIN -->
    <main class="
        w-full
        max-w-6xl
        min-[1400px]:max-w-7xl
        mx-auto
        px-5
        py-10
        flex-1
    ">

        <section class="max-w-2xl mx-auto">

            <!-- JUDUL -->
            <div class="mb-6">

                <p class="text-sm font-medium text-indigo-600 mb-1">
                    Manajemen Anggota
                </p>

                <h2 class="text-2xl md:text-3xl font-bold">
                    Tambah Anggota
                </h2>

                <p class="text-slate-500 mt-2">
                    Masukkan informasi anggota baru yang akan didaftarkan
                    ke perpustakaan.
                </p>

            </div>


            <!-- FORM CARD -->
            <form class="
                bg-white
                border
                border-slate-200
                rounded-2xl
                shadow-sm
                p-5
                sm:p-6
                md:p-8
            ">


                <!-- NO ANGGOTA -->
                <div class="mb-5">

                    <label
                        for="noAnggota"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        No. Anggota
                    </label>

                    <input
                        type="text"
                        id="noAnggota"
                        name="noAnggota"
                        placeholder="Contoh: A001"
                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-white
                            text-slate-900
                            placeholder:text-slate-400
                            outline-none
                            focus:border-indigo-500
                            focus:ring-4
                            focus:ring-indigo-100
                            transition
                        ">

                </div>


                <!-- NAMA -->
                <div class="mb-5">

                    <label
                        for="nama"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama anggota"
                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-white
                            outline-none
                            focus:border-indigo-500
                            focus:ring-4
                            focus:ring-indigo-100
                            transition
                        ">

                </div>


                <!-- ALAMAT -->
                <div class="mb-5">

                    <label
                        for="alamat"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        Alamat
                    </label>

                    <textarea
                        id="alamat"
                        name="alamat"
                        rows="4"
                        placeholder="Masukkan alamat anggota"
                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-white
                            outline-none
                            resize-y
                            focus:border-indigo-500
                            focus:ring-4
                            focus:ring-indigo-100
                            transition
                        "></textarea>

                </div>


                <!-- NO HP -->
                <div class="mb-6">

                    <label
                        for="noHp"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        No. HP
                    </label>

                    <input
                        type="tel"
                        id="noHp"
                        name="noHp"
                        placeholder="Contoh: 081234567890"
                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-xl
                            px-4
                            py-3
                            bg-white
                            outline-none
                            focus:border-indigo-500
                            focus:ring-4
                            focus:ring-indigo-100
                            transition
                        ">

                </div>


                <!-- BUTTON -->
                <div class="
                    pt-5
                    border-t
                    border-slate-100
                    flex
                    flex-col-reverse
                    sm:flex-row
                    sm:justify-end
                    gap-3
                ">

                    <a
                        href="list.html"
                        class="
                            text-center
                            bg-slate-100
                            hover:bg-slate-200
                            text-slate-700
                            font-medium
                            px-5
                            py-2.5
                            rounded-xl
                            transition
                        ">
                        Batal
                    </a>

                    <button
                        type="submit"
                        class="
                            bg-indigo-600
                            hover:bg-indigo-700
                            text-white
                            font-medium
                            px-5
                            py-2.5
                            rounded-xl
                            shadow-sm
                            transition
                        ">
                        Simpan Anggota
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="
        border-t
        border-slate-200
        text-center
        text-sm
        text-slate-400
        py-5
    ">
        &copy; 2026 SIMPUS-Mini
    </footer>

</body>

</html>
