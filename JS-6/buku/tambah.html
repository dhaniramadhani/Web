<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Buku</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">

        <div class="relative w-full max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">

            <h1 class="text-xl font-bold text-indigo-600">
                SIMPUS-Mini
            </h1>

            <button
                type="button"
                id="nav-toggle-btn"
                aria-label="Buka menu"
                aria-expanded="false"
                class="md:hidden text-2xl text-slate-700">
                ☰
            </button>
            <nav
            id="main-nav"
            class="hidden absolute top-full left-0 w-full bg-white border-b border-slate-200 shadow-md p-4
                   md:block md:static md:w-auto md:border-0 md:shadow-none md:p-0">

                <ul class="flex flex-col gap-2 md:flex-row md:items-center">

                    <li>
                        <a
                            href="../index.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">
                            Beranda
                        </a>
                    </li>

                    <li>
                        <a
                            href="list.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">
                            Daftar Buku
                        </a>
                    </li>

                    <li>
                        <a
                            href="tambah.html"
                            class="block px-4 py-2 rounded-lg bg-indigo-50 text-indigo-600 font-medium">
                            Tambah Buku
                        </a>
                    </li>

                    <li>
                        <a
                            href="../anggota/list.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">
                            Daftar Anggota
                        </a>
                    </li>

                    <li>
                        <a
                            href="../anggota/tambah.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600">
                            Tambah Anggota
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main class="w-full max-w-2xl mx-auto px-5 py-10 flex-1">

        <div class="mb-6">

            <p class="text-sm font-medium text-indigo-600 mb-1">
                Manajemen Buku
            </p>

            <h2 class="text-2xl md:text-3xl font-bold">
                Tambah Buku
            </h2>

            <p class="text-slate-500 mt-2">
                Masukkan informasi buku baru.
            </p>

        </div>

        <form
            id="form-tambah"
            novalidate
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">

            <div class="mb-5">

                <label
                    for="judul"
                    class="block text-sm font-semibold text-slate-700 mb-2">
                    Judul Buku
                </label>

                <input
                    type="text"
                    id="judul"
                    name="judul"
                    placeholder="Masukkan judul buku"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">

            </div>

            <div class="mb-5">

                <label
                    for="penulis"
                    class="block text-sm font-semibold text-slate-700 mb-2">
                    Penulis
                </label>

                <input
                    type="text"
                    id="penulis"
                    name="penulis"
                    placeholder="Masukkan nama penulis"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">

            </div>

            <div class="mb-5">

                <label
                    for="penerbit"
                    class="block text-sm font-semibold text-slate-700 mb-2">
                    Penerbit
                </label>

                <input
                    type="text"
                    id="penerbit"
                    name="penerbit"
                    placeholder="Masukkan penerbit"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">

                <div>

                    <label
                        for="tahun"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        Tahun Terbit
                    </label>

                    <input
                        type="number"
                        id="tahun"
                        name="tahun"
                        placeholder="Contoh: 2020"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">

                </div>

                <div>

                    <label
                        for="stok"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        Stok
                    </label>

                    <input
                        type="number"
                        id="stok"
                        name="stok"
                        placeholder="Contoh: 5"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">

                </div>

            </div>

            <div class="mb-6">

                <label
                    for="kategori"
                    class="block text-sm font-semibold text-slate-700 mb-2">
                    Kategori
                </label>

                <select
                    id="kategori"
                    name="kategori"
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 bg-white outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">

                    <option value="">
                        Pilih kategori
                    </option>

                    <option value="novel">
                        Novel
                    </option>

                    <option value="pendidikan">
                        Pendidikan
                    </option>

                    <option value="teknologi">
                        Teknologi
                    </option>

                    <option value="sejarah">
                        Sejarah
                    </option>

                </select>

            </div>

            <div class="flex justify-end gap-3 pt-5 border-t border-slate-100">

                <a
                    href="list.html"
                    class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-5 py-2.5 rounded-xl">
                    Batal
                </a>

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl">
                    Simpan Buku
                </button>

            </div>

        </form>

    </main>

    <footer class="border-t border-slate-200 text-center text-sm text-slate-400 py-5">
        &copy; 2026 SIMPUS-Mini — Jobsheet 5
    </footer>

    <script src="../assets/js/app.js"></script>

</body>

</html>
