<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMPUS-Mini | Daftar Buku</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">

        <div class="relative w-full max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">

            <a
                href="../index.html"
                class="text-xl font-bold text-indigo-600">
                SIMPUS-Mini
            </a>


            <button
                type="button"
                id="nav-toggle-btn"
                aria-label="Buka menu navigasi"
                aria-expanded="false"
                class="md:hidden text-2xl text-slate-700 cursor-pointer">
                ☰
            </button>


            <nav
                id="main-nav"
                class="hidden absolute top-full left-0 w-full bg-white border-b border-slate-200 shadow-md p-4
                       md:block md:static md:w-auto md:border-0 md:shadow-none md:p-0">

                <ul class="flex flex-col gap-2 md:flex-row md:items-center">

                    <li>
                        <a
                            href="../index.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition">
                            Dashboard
                        </a>
                    </li>

                    <li>
                        <a
                            href="list.html"
                            class="block px-4 py-2 rounded-lg bg-indigo-50 text-indigo-600 font-medium">
                            Buku
                        </a>
                    </li>

                    <li>
                        <a
                            href="../anggota/list.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition">
                            Anggota
                        </a>
                    </li>

                    <li>
                        <a
                            href="../peminjaman.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition">
                            Peminjaman
                        </a>
                    </li>

                    <li>
                        <a
                            href="../pengembalian.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition">
                            Pengembalian
                        </a>
                    </li>

                    <li>
                        <a
                            href="../riwayat.html"
                            class="block px-4 py-2 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition">
                            Riwayat
                        </a>
                    </li>

                    <li>
                        <a
                            href="../login.html"
                            class="block px-4 py-2 rounded-lg text-red-600 hover:bg-red-50 transition">
                            Logout
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main class="w-full max-w-7xl mx-auto px-5 py-10 flex-1">

        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6">

            <div>

                <p class="text-sm font-medium text-indigo-600 mb-1">
                    Manajemen Buku
                </p>

                <h2 class="text-2xl md:text-3xl font-bold">
                    Daftar Buku
                </h2>

                <p class="text-slate-500 mt-2">
                    Data buku dimuat dari file JSON menggunakan Fetch API.
                </p>

            </div>


            <a
                href="tambah.html"
                class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm transition">
                + Tambah Buku
            </a>

        </div>


        <div class="mb-6">

            <label
                for="search-input"
                class="block text-sm font-semibold text-slate-700 mb-2">
                Cari Buku
            </label>

            <input
                type="text"
                id="search-input"
                placeholder="Cari judul, pengarang, tahun, atau stok..."
                class="w-full max-w-md bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 placeholder:text-slate-400 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition">

        </div>


        <div
            id="loading-indicator"
            class="hidden mb-4 bg-indigo-50 border border-indigo-100 text-indigo-600 px-4 py-3 rounded-xl text-sm font-medium">

            Memuat data buku...

        </div>


        <div class="table-responsive overflow-x-auto bg-white border border-slate-200 rounded-2xl shadow-sm">

            <table class="w-full min-w-[800px]">

                <thead class="bg-slate-50 border-b border-slate-200">

                    <tr>

                        <th class="text-left px-5 py-4 text-xs font-semibold text-slate-500 uppercase">
                            No
                        </th>

                        <th class="text-left px-5 py-4 text-xs font-semibold text-slate-500 uppercase">
                            Judul
                        </th>

                        <th class="text-left px-5 py-4 text-xs font-semibold text-slate-500 uppercase">
                            Pengarang
                        </th>

                        <th class="text-left px-5 py-4 text-xs font-semibold text-slate-500 uppercase">
                            Tahun
                        </th>

                        <th class="text-left px-5 py-4 text-xs font-semibold text-slate-500 uppercase">
                            Stok
                        </th>

                        <th class="text-left px-5 py-4 text-xs font-semibold text-slate-500 uppercase">
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="data-buku"
                    class="divide-y divide-slate-100">
                </tbody>

            </table>

        </div>

    </main>


    <footer class="border-t border-slate-200 text-center text-sm text-slate-400 py-5">

        &copy; 2026 SIMPUS-Mini — Jobsheet 6

    </footer>


    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>

</body>

</html>
