<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMPUS-Mini | Tambah Buku</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">


    <!-- =========================
         HEADER
    ========================== -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">

        <div class="relative max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">


            <!-- Logo -->
            <h1 class="text-xl font-bold text-indigo-600">
                SIMPUS-Mini
            </h1>


            <!-- Hamburger -->
            <input
                type="checkbox"
                id="nav-toggle"
                class="peer sr-only">


            <label
                for="nav-toggle"
                class="md:hidden text-2xl cursor-pointer text-slate-700 select-none">
                ☰
            </label>



            <!-- Navbar -->
            <nav class="
                hidden
                peer-checked:block

                absolute
                top-full
                left-0
                w-full

                bg-white
                border-b
                border-slate-200
                shadow-md
                p-4

                md:block
                md:static
                md:w-auto
                md:border-0
                md:shadow-none
                md:p-0
            ">

                <ul class="flex flex-col gap-2 md:flex-row md:items-center">


                    <li>
                        <a
                            href="../index.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                text-slate-600
                                hover:bg-indigo-50
                                hover:text-indigo-600
                                transition
                            ">
                            Beranda
                        </a>
                    </li>


                    <li>
                        <a
                            href="list.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                text-slate-600
                                hover:bg-indigo-50
                                hover:text-indigo-600
                                transition
                            ">
                            Daftar Buku
                        </a>
                    </li>


                    <li>
                        <a
                            href="tambah.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                bg-indigo-50
                                text-indigo-600
                                font-medium
                            ">
                            Tambah Buku
                        </a>
                    </li>


                    <li>
                        <a
                            href="../anggota/list.html"
                            class="
                                block
                                px-4
                                py-2
                                rounded-lg
                                text-slate-600
                                hover:bg-indigo-50
                                hover:text-indigo-600
                                transition
                            ">
                            Daftar Anggota
                        </a>
                    </li>


                </ul>

            </nav>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->
    <main class="w-full max-w-6xl mx-auto px-5 py-10 flex-1">


        <section class="max-w-2xl">


            <!-- JUDUL -->
            <div class="mb-6">

                <h2 class="text-2xl font-bold">
                    Tambah Buku
                </h2>

                <p class="text-slate-500 mt-1">
                    Tambahkan data buku baru ke perpustakaan.
                </p>

            </div>



            <!-- =========================
                 FORM
            ========================== -->
            <form class="
                bg-white
                border
                border-slate-200
                rounded-2xl
                shadow-sm
                p-5
                md:p-8
            ">


                <!-- JUDUL BUKU -->
                <div class="mb-5">

                    <label
                        for="judul"
                        class="block text-sm font-medium mb-2">
                        Judul Buku
                    </label>

                    <input
                        type="text"
                        id="judul"
                        name="judul"
                        placeholder="Masukkan judul buku"

                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-lg

                            px-4
                            py-2.5

                            outline-none

                            focus:border-indigo-500
                            focus:ring-2
                            focus:ring-indigo-100

                            transition
                        ">

                </div>



                <!-- PENULIS -->
                <div class="mb-5">

                    <label
                        for="penulis"
                        class="block text-sm font-medium mb-2">
                        Penulis
                    </label>

                    <input
                        type="text"
                        id="penulis"
                        name="penulis"
                        placeholder="Masukkan nama penulis"

                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-lg

                            px-4
                            py-2.5

                            outline-none

                            focus:border-indigo-500
                            focus:ring-2
                            focus:ring-indigo-100

                            transition
                        ">

                </div>



                <!-- PENERBIT -->
                <div class="mb-5">

                    <label
                        for="penerbit"
                        class="block text-sm font-medium mb-2">
                        Penerbit
                    </label>

                    <input
                        type="text"
                        id="penerbit"
                        name="penerbit"
                        placeholder="Masukkan nama penerbit"

                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-lg

                            px-4
                            py-2.5

                            outline-none

                            focus:border-indigo-500
                            focus:ring-2
                            focus:ring-indigo-100

                            transition
                        ">

                </div>



                <!-- TAHUN TERBIT -->
                <div class="mb-5">

                    <label
                        for="tahun"
                        class="block text-sm font-medium mb-2">
                        Tahun Terbit
                    </label>

                    <input
                        type="number"
                        id="tahun"
                        name="tahun"
                        placeholder="Contoh: 2026"

                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-lg

                            px-4
                            py-2.5

                            outline-none

                            focus:border-indigo-500
                            focus:ring-2
                            focus:ring-indigo-100

                            transition
                        ">

                </div>



                <!-- KATEGORI -->
                <div class="mb-6">

                    <label
                        for="kategori"
                        class="block text-sm font-medium mb-2">
                        Kategori
                    </label>


                    <select
                        id="kategori"
                        name="kategori"

                        class="
                            w-full
                            border
                            border-slate-300
                            rounded-lg

                            px-4
                            py-2.5

                            bg-white
                            outline-none

                            focus:border-indigo-500
                            focus:ring-2
                            focus:ring-indigo-100

                            transition
                        ">

                        <option value="">
                            Pilih kategori
                        </option>

                        <option value="novel">
                            Novel
                        </option>

                        <option value="pendidikan">
                            Pendidikan
                        </option>

                        <option value="teknologi">
                            Teknologi
                        </option>

                        <option value="sejarah">
                            Sejarah
                        </option>

                    </select>

                </div>



                <!-- BUTTON -->
                <div class="
                    flex
                    flex-col
                    sm:flex-row
                    gap-3
                ">


                    <button
                        type="submit"
                        class="
                            bg-indigo-600
                            hover:bg-indigo-700

                            text-white
                            font-medium

                            px-5
                            py-2.5

                            rounded-lg
                            transition
                        ">
                        Simpan
                    </button>


                    <a
                        href="list.html"
                        class="
                            text-center

                            bg-slate-100
                            hover:bg-slate-200

                            text-slate-700
                            font-medium

                            px-5
                            py-2.5

                            rounded-lg
                            transition
                        ">
                        Batal
                    </a>


                </div>


            </form>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="
        bg-white
        border-t
        border-slate-200
        text-center
        text-sm
        text-slate-500
        py-5
    ">

        <p>
            &copy; 2026 SIMPUS-Mini — Jobsheet 3
        </p>

    </footer>


</body>

</html>
